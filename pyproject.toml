[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detaudit"
version = "0.1.0"
description = "Reproducible cross-domain object-detection failure audit"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pycocotools>=2.0.7", "Pillow>=10"]

[project.scripts]
detaudit-run = "detaudit.run:main"
detaudit-analyze = "detaudit.analyze:main"
detaudit-tide = "detaudit.tide_report:main"
detaudit-preflight = "detaudit.preflight:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
